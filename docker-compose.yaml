services:

  postgres:
    image: postgres:16
    container_name: AITravelPlannerAgent_postgres

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  weaviate:

    image: semitechnologies/weaviate:latest

    container_name: travelplanner_weaviate

    restart: always

    ports:
      - "${WEAVIATE_PORT}:8080"

    environment:

      QUERY_DEFAULTS_LIMIT: 25

      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"

      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"

      DEFAULT_VECTORIZER_MODULE: none

      ENABLE_MODULES: ""

      CLUSTER_HOSTNAME: node1

    volumes:
      - weaviate_data:/var/lib/weaviate

  ollama:

    image: ollama/ollama:latest

    container_name: travelplanner_ollama

    restart: always

    ports:
      - "${OLLAMA_PORT}:11434"

    volumes:
      - ollama_data:/root/.ollama
      
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: travelplanner_backend

    restart: always

    ports:
      - "${BACKEND_PORT}:8000"

    env_file:
      - .env

    volumes:
      - ./backend:/app

    depends_on:
      - postgres
      - weaviate
      - ollama

volumes:

  postgres_data:

  weaviate_data:

  ollama_data: